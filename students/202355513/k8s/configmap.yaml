apiVersion: v1
kind: ConfigMap
metadata:
  name: lunch-vote-config
data:
  POLL_QUESTION: "오늘 점심 뭐 먹을까?"
  POLL_OPTIONS: "한식,중식,일식,양식"

  app.py: |
    import os
    import sqlite3
    import html
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import parse_qs

    QUESTION = os.getenv("POLL_QUESTION", "오늘 점심 뭐 먹을까?")
    OPTIONS = os.getenv("POLL_OPTIONS", "한식,중식,일식,양식").split(",")
    ADMIN_PASSWORD = os.getenv("ADMIN_PASSWORD", "")
    DB_PATH = "/data/votes.db"

    def connect_db():
        conn = sqlite3.connect(DB_PATH)
        conn.execute("""
            CREATE TABLE IF NOT EXISTS votes (
                option TEXT PRIMARY KEY,
                count INTEGER NOT NULL DEFAULT 0
            )
        """)

        for option in OPTIONS:
            conn.execute(
                "INSERT OR IGNORE INTO votes(option, count) VALUES (?, 0)",
                (option,)
            )

        conn.commit()
        return conn

    def get_votes():
        with connect_db() as conn:
            return conn.execute(
                "SELECT option, count FROM votes"
            ).fetchall()

    class Handler(BaseHTTPRequestHandler):

        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK")
                return

            if self.path != "/":
                self.send_error(404)
                return

            votes = get_votes()
            total = sum(count for _, count in votes)

            options_html = ""
            results_html = ""

            for option, count in votes:
                safe_option = html.escape(option)

                options_html += f"""
                    <label>
                        <input type="radio" name="option"
                               value="{safe_option}" required>
                        {safe_option}
                    </label><br>
                """

                percent = 0 if total == 0 else count / total * 100

                results_html += f"""
                    <p>
                        <strong>{safe_option}</strong>
                        - {count}표 ({percent:.1f}%)
                    </p>
                """

            page = f"""
            <!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>Lunch Vote</title>
                <style>
                    body {{
                        font-family: sans-serif;
                        max-width: 600px;
                        margin: 60px auto;
                        padding: 20px;
                    }}

                    button {{
                        margin-top: 15px;
                        padding: 8px 16px;
                    }}

                    .section {{
                        margin-top: 30px;
                    }}
                </style>
            </head>

            <body>
                <h1>Lunch Vote</h1>
                <h2>{html.escape(QUESTION)}</h2>

                <form method="POST" action="/vote">
                    {options_html}
                    <button type="submit">투표하기</button>
                </form>

                <div class="section">
                    <h2>현재 결과</h2>
                    {results_html}
                    <p>총 {total}표</p>
                </div>

                <div class="section">
                    <h3>관리자</h3>

                    <form method="POST" action="/reset">
                        <input type="password"
                               name="password"
                               placeholder="관리자 비밀번호"
                               required>

                        <button type="submit">
                            투표 초기화
                        </button>
                    </form>
                </div>
            </body>
            </html>
            """

            body = page.encode("utf-8")

            self.send_response(200)
            self.send_header(
                "Content-Type",
                "text/html; charset=utf-8"
            )
            self.send_header(
                "Content-Length",
                str(len(body))
            )
            self.end_headers()

            self.wfile.write(body)

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            data = parse_qs(
                self.rfile.read(length).decode("utf-8")
            )

            if self.path == "/vote":
                option = data.get("option", [""])[0]

                if option in OPTIONS:
                    with connect_db() as conn:
                        conn.execute(
                            "UPDATE votes SET count = count + 1 "
                            "WHERE option = ?",
                            (option,)
                        )
                        conn.commit()

                self.redirect("/")
                return

            if self.path == "/reset":
                password = data.get("password", [""])[0]

                if password != ADMIN_PASSWORD:
                    self.send_error(403, "Invalid password")
                    return

                with connect_db() as conn:
                    conn.execute("UPDATE votes SET count = 0")
                    conn.commit()

                self.redirect("/")
                return

            self.send_error(404)

        def redirect(self, location):
            self.send_response(303)
            self.send_header("Location", location)
            self.end_headers()

    if __name__ == "__main__":
        connect_db()

        server = HTTPServer(
            ("0.0.0.0", 8080),
            Handler
        )

        print("Lunch Vote running on port 8080")
        server.serve_forever()