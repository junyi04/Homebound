{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "homebound",
    "labels": {
      "app": "homebound"
    }
  },
  "spec": {
    "selector": {
      "app": "homebound"
    },
    "ports": [
      {
        "name": "http",
        "port": 8080,
        "targetPort": "http"
      }
    ],
    "type": "ClusterIP"
  }
}
