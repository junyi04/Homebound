  "data": {
    "server.py": "\"\"\"Homebound: standard-library-only HTTP server and persistent leaderboard.\"\"\"\nimport hashlib\nimport hmac\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport sqlite3\nimport time\nfrom contextlib import contextmanager\nfrom datetime import datetime, timezone, timedelta\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom urllib.parse import urlparse, parse_qs\n\nROOT = Path(__file__).parent\nDATA = Path(os.environ.get('DATA_DIR', ROOT.parent / '.local-data'))\nDATA.mkdir(parents=True, exist_ok=True)\nDB = DATA / 'homebound.db'\nADMIN = os.environ.get('ADMIN_PASSWORD', '')\nKST = timezone(timedelta(hours=9))\nCONFIG = {'title': os.environ.get('GAME_TITLE', '집 가는 길'),\n          'deadlineSeconds': max(10, min(60, int(os.environ.get('DEADLINE_SECONDS', '18')))),\n          'trafficSpeed': max(.5, min(2, float(os.environ.get('TRAFFIC_SPEED', '1'))))}\n\n\n@contextmanager\ndef connect():\n    db = sqlite3.connect(DB, timeout=10)\n    db.row_factory = sqlite3.Row\n    try:\n        with db:\n            yield db\n    finally:\n        db.close()\n\n\ndef initialize():\n    with connect() as db:\n        db.execute('PRAGMA journal_mode=WAL')\n        db.executescript('''\n          CREATE TABLE IF NOT EXISTS runs (\n            token TEXT PRIMARY KEY, mode TEXT NOT NULL, day TEXT NOT NULL,\n            seed INTEGER NOT NULL, started REAL NOT NULL, used INTEGER NOT NULL DEFAULT 0);\n          CREATE TABLE IF NOT EXISTS scores (\n            id INTEGER PRIMARY KEY, name TEXT NOT NULL, score INTEGER NOT NULL,\n            distance INTEGER NOT NULL, mode TEXT NOT NULL, day TEXT NOT NULL,\n            created TEXT NOT NULL);\n          CREATE INDEX IF NOT EXISTS score_order ON scores(mode, day, score DESC);\n        ''')\n\n\ndef day():\n    return datetime.now(KST).strftime('%Y-%m-%d')\n\n\nclass Handler(BaseHTTPRequestHandler):\n    server_version = 'Homebound/1.0'\n\n    def send(self, status, value, content_type='application/json; charset=utf-8'):\n        body = json.dumps(value, ensure_ascii=False).encode() if isinstance(value, (dict, list)) else value\n        self.send_response(status)\n        self.send_header('Content-Type', content_type)\n        self.send_header('Content-Length', str(len(body)))\n        self.send_header('X-Content-Type-Options', 'nosniff')\n        self.send_header('Referrer-Policy', 'same-origin')\n        self.send_header('Cache-Control', 'no-store' if content_type.startswith('application/json') else 'no-cache')\n        self.send_header('Content-Security-Policy', \"default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'\")\n        self.end_headers()\n        self.wfile.write(body)\n\n    def do_GET(self):\n        url = urlparse(self.path)\n        if url.path == '/health/live':\n            return self.send(200, {'status': 'alive'})\n        if url.path == '/health/ready':\n            try:\n                with connect() as db:\n                    db.execute('SELECT COUNT(*) FROM scores').fetchone()\n                return self.send(200, {'status': 'ready'})\n            except sqlite3.Error:\n                return self.send(503, {'status': 'database unavailable'})\n        if url.path == '/api/config':\n            return self.send(200, {**CONFIG, 'day': day()})\n        if url.path == '/api/leaderboard':\n            mode = parse_qs(url.query).get('mode', ['daily'])[0]\n            if mode not in ('daily', 'endless'):\n                return self.send(400, {'error': '잘못된 게임 모드입니다.'})\n            try:\n                with connect() as db:\n                    where = 'mode = ?' + (' AND day = ?' if mode == 'daily' else '')\n                    args = [mode, day()] if mode == 'daily' else [mode]\n                    rows = db.execute(f'''SELECT name, MAX(score) AS score, MAX(distance) AS distance\n                        FROM scores WHERE {where} GROUP BY name\n                        ORDER BY score DESC, name ASC LIMIT 10''', args).fetchall()\n                return self.send(200, {'entries': [dict(r) for r in rows], 'day': day()})\n            except sqlite3.Error:\n                return self.send(503, {'error': '기록 보관소에 연결할 수 없습니다.'})\n        files = {'/': ('index.html', 'text/html; charset=utf-8'),\n                 '/style.css': ('style.css', 'text/css; charset=utf-8'),\n                 '/game.js': ('game.js', 'text/javascript; charset=utf-8'),\n                 '/engine.js': ('engine.js', 'text/javascript; charset=utf-8')}\n        if url.path in files:\n            filename, mime = files[url.path]\n            return self.send(200, (ROOT / filename).read_bytes(), mime)\n        self.send(404, {'error': '찾을 수 없는 경로입니다.'})\n\n    def do_POST(self):\n        try:\n            length = int(self.headers.get('Content-Length', '0'))\n            if length < 1 or length > 4096:\n                return self.send(413, {'error': '요청 크기가 올바르지 않습니다.'})\n            if self.headers.get('Content-Type', '').split(';')[0] != 'application/json':\n                return self.send(415, {'error': 'JSON 요청만 허용됩니다.'})\n            body = json.loads(self.rfile.read(length))\n            if not isinstance(body, dict):\n                raise ValueError()\n            self.post_json(urlparse(self.path).path, body)\n        except (ValueError, TypeError, KeyError, UnicodeDecodeError):\n            self.send(400, {'error': '입력값을 확인해 주세요.'})\n        except sqlite3.Error:\n            self.send(503, {'error': '기록 보관소가 잠시 바쁩니다. 다시 시도해 주세요.'})\n\n    def post_json(self, path, body):\n        if path == '/api/runs':\n            mode = body.get('mode', 'daily')\n            if mode not in ('daily', 'endless'):\n                raise ValueError()\n            today = day()\n            seed = int(hashlib.sha256(('homebound-v1-' + today).encode()).hexdigest()[:8], 16) if mode == 'daily' else secrets.randbits(32)\n            token = secrets.token_urlsafe(24)\n            with connect() as db:\n                db.execute('DELETE FROM runs WHERE started < ?', (time.time() - 86400,))\n                db.execute('INSERT INTO runs(token, mode, day, seed, started) VALUES (?,?,?,?,?)',\n                           (token, mode, today, seed, time.time()))\n            return self.send(201, {'token': token, 'seed': seed, 'day': today, 'config': CONFIG})\n        if path == '/api/scores':\n            name = body.get('name', '').strip()\n            distance, cards = body.get('distance'), body.get('cards')\n            if not re.fullmatch(r'[\\w가-힣 .-]{1,12}', name) or type(distance) is not int or type(cards) is not int:\n                raise ValueError()\n            with connect() as db:\n                db.execute('BEGIN IMMEDIATE')\n                run = db.execute('SELECT * FROM runs WHERE token = ?', (body.get('token', ''),)).fetchone()\n                if not run or run['used']:\n                    return self.send(409, {'error': '이미 저장했거나 만료된 게임입니다.'})\n                elapsed = time.time() - run['started']\n                if elapsed > 86400 or not 0 <= distance <= min(100000, int(elapsed * 9) + 3) or not 0 <= cards <= distance // 7 + 1:\n                    return self.send(400, {'error': '게임 기록을 확인할 수 없습니다.'})\n                score = distance * 10 + cards * 50\n                db.execute('INSERT INTO scores(name,score,distance,mode,day,created) VALUES (?,?,?,?,?,?)',\n                           (name, score, distance, run['mode'], run['day'], datetime.now(KST).isoformat()))\n                db.execute('UPDATE runs SET used=1 WHERE token=?', (run['token'],))\n            return self.send(201, {'score': score})\n        if path == '/api/admin/reset':\n            supplied = self.headers.get('Authorization', '').removeprefix('Bearer ')\n            if not ADMIN or not hmac.compare_digest(supplied.encode(), ADMIN.encode()):\n                return self.send(403, {'error': '관리자 비밀번호가 올바르지 않습니다.'})\n            if body.get('confirm') != 'RESET':\n                raise ValueError()\n            with connect() as db:\n                db.execute('DELETE FROM scores')\n                db.execute('DELETE FROM runs')\n            return self.send(200, {'status': 'reset'})\n        self.send(404, {'error': '찾을 수 없는 경로입니다.'})\n\n\nif __name__ == '__main__':\n    initialize()\n    server = ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT', '8080'))), Handler)\n    print('Homebound listening on port', server.server_port, flush=True)\n    server.serve_forever()\n",
    "index.html": "<!doctype html>\n<html lang=\"ko\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><meta name=\"theme-color\" content=\"#151c18\"><title>집 가는 길 · HOMEBOUND</title><link rel=\"stylesheet\" href=\"/style.css\"></head>\n<body>\n<header class=\"header\"><a class=\"brand\" href=\"/\" aria-label=\"집 가는 길 홈\"><span class=\"brand-icon\">↗</span><span>HOMEBOUND<span class=\"brand-ko\">집 가는 길</span></span></a><span class=\"header-label\">A LITTLE CAMPUS ESCAPE</span><button id=\"sound\" class=\"icon-button\" aria-pressed=\"false\" title=\"효과음 켜기\">♪ <span>OFF</span></button></header>\n<main>\n  <section class=\"intro\"><div><div class=\"eyebrow\"><span class=\"live-dot\"></span> 수업 끝. 진짜 모험은 지금부터.</div><h1>오늘도 무사히,<br><span>집 가는 길.</span></h1><p>차는 피하고, 커피는 챙기고. 과제 마감보다 빠르게!<br>한 칸 더 가고 싶은 캠퍼스 탈출 아케이드.</p></div><div class=\"intro-stamp\"><span>수업은 끝났다</span><strong>집에<br>가자!</strong><small>EST. AFTER CLASS</small></div></section>\n  <div class=\"layout\">\n  <section class=\"game-section\" aria-label=\"귀가 게임\">\n    <div class=\"game-top\"><div class=\"mode-switch\" role=\"group\" aria-label=\"게임 모드\"><button id=\"daily\" class=\"selected\" aria-pressed=\"true\">오늘의 귀갓길 <span>DAILY</span></button><button id=\"endless\" aria-pressed=\"false\">자유 귀가</button></div><span id=\"day\" class=\"day\">연결 중</span></div>\n    <div class=\"playfield\" id=\"playfield\">\n      <canvas id=\"game\" width=\"800\" height=\"640\" tabindex=\"0\" aria-label=\"방향키 또는 WASD로 이동하는 귀가 게임. P 키로 일시정지.\"></canvas>\n      <div class=\"hud\"><div><span>걸어온 길</span><strong id=\"distance\">0 <small>m</small></strong></div><div class=\"hud-right\"><span>이번 귀가 점수</span><strong id=\"score\">0000</strong></div></div>\n      <div id=\"zone\" class=\"zone\">01 / 캠퍼스 정문</div>\n      <div class=\"deadline\" id=\"deadline\" hidden><span>과제 마감이 쫓아온다!</span><progress id=\"deadline-bar\" max=\"18\" value=\"18\"></progress></div>\n      <div id=\"effect\" class=\"effect\" aria-live=\"polite\"></div>\n      <button id=\"pause\" class=\"pause\" aria-label=\"일시정지\" hidden>Ⅱ</button>\n      <div class=\"overlay\" id=\"welcome\"><div class=\"welcome-card\"><div class=\"ticket-label\">YOUR NEXT STOP: HOME</div><div class=\"pixel-student\" aria-hidden=\"true\">🎒</div><h2>퇴근 아니고, 귀가.</h2><p>오늘도 학교 밖은 만만치 않다.<br>가방 챙겼으면 출발해 볼까?</p><button id=\"start\" class=\"primary\">집으로 출발 <span>↗</span></button><small>방향키 / WASD · 모바일은 아래 버튼</small><p id=\"start-error\" class=\"error\" role=\"alert\"></p></div></div>\n      <div class=\"overlay\" id=\"paused\" hidden><div class=\"welcome-card\"><div class=\"ticket-label\">TAKE A BREATHER</div><h2>잠깐 쉬어 가자.</h2><p>쉬는 동안은 마감도 기다려 줘요.</p><button id=\"resume\" class=\"primary\">계속 걷기 ↗</button></div></div>\n      <div class=\"overlay\" id=\"result\" hidden><div class=\"welcome-card result-card\"><div class=\"ticket-label\">TODAY'S WALK RECEIPT</div><h2 id=\"result-title\">오늘의 귀가 종료!</h2><p id=\"reason\"></p><div class=\"receipt\"><span>최종 점수</span><strong id=\"final-score\">0</strong><small id=\"final-distance\"></small></div><form id=\"save-form\"><label for=\"nickname\">랭킹에 남길 이름</label><div class=\"save-row\"><input id=\"nickname\" name=\"nickname\" maxlength=\"12\" placeholder=\"집가고싶은사람\" required autocomplete=\"nickname\"><button id=\"save\" type=\"submit\">기록 저장</button></div></form><p id=\"save-message\" role=\"status\"></p><button id=\"retry\" class=\"primary\">한 번만 더 <span>↻</span></button><button id=\"back\" class=\"text-button\">모드 선택으로 돌아가기</button></div></div>\n    </div>\n    <div class=\"game-bottom\"><span><b>↑ ← ↓ →</b> 이동 <i>·</i> <b>P</b> 쉬어가기</span><span id=\"best\">내 최고 <b>0</b></span></div>\n    <div class=\"touch-controls\" aria-label=\"터치 이동\"><button data-move=\"up\" aria-label=\"앞으로\">↑</button><div><button data-move=\"left\" aria-label=\"왼쪽\">←</button><button data-move=\"down\" aria-label=\"뒤로\">↓</button><button data-move=\"right\" aria-label=\"오른쪽\">→</button></div></div>\n  </section>\n  <aside>\n    <section class=\"panel leaderboard\"><div class=\"panel-heading\"><div><span class=\"eyebrow\">THE WAY HOME CLUB</span><h2>귀가 명예의 전당 <span>↗</span></h2></div><button id=\"refresh\" class=\"icon-button\" aria-label=\"랭킹 새로고침\">↻</button></div><p id=\"ranking-description\">같은 길, 다른 기록. 오늘의 귀가왕은?</p><div class=\"ranking-header\"><span>순위 / 이름</span><span>점수</span></div><ol id=\"rankings\"><li class=\"empty\">기록을 불러오는 중…</li></ol><div class=\"ranking-footer\"><span class=\"live-dot\"></span> 서버에 저장되는 우리들의 발자국</div></section>\n    <section class=\"panel guide\"><span class=\"eyebrow\">POCKET GUIDE</span><h2>귀가 생존 키트</h2><div class=\"item\"><span class=\"item-icon coffee\">☕</span><div><b>아이스 아메리카노</b><p>6초 동안 발걸음이 빨라져요.</p></div><small>BOOST</small></div><div class=\"item\"><span class=\"item-icon umbrella\">☂</span><div><b>든든한 우산</b><p>충돌을 딱 한 번 막아 줘요.</p></div><small>SHIELD</small></div><div class=\"item\"><span class=\"item-icon card\">▣</span><div><b>잃어버린 학생증</b><p>주우면 보너스 50점!</p></div><small>+50</small></div><div class=\"tip\"><b>선배의 한마디</b><p>잔디에서 숨을 고르세요. 단, 너무 오래 머물면 과제 마감에 잡혀요.</p></div></section>\n  </aside>\n  </div>\n  <section class=\"notes\"><span>01 <b>한 칸씩, 조심조심</b><small>차도와 물웅덩이를 피해 이동하세요.</small></span><span>02 <b>매일 새로운 귀갓길</b><small>한국 시간 자정마다 도전 맵이 바뀌어요.</small></span><span>03 <b>기록은 남으니까</b><small>다시 도전해 어제의 나를 넘어 보세요.</small></span></section>\n</main>\n<footer><span>HOMEBOUND <i>© 2026</i></span><p>학교 밖 작은 모험. 오리지널 캠퍼스 아케이드.</p><button id=\"admin-open\" class=\"text-button\">관리실</button></footer>\n<dialog id=\"admin-dialog\"><form id=\"admin-form\"><div class=\"eyebrow\">ADMIN OFFICE</div><h2>기록 관리실</h2><p>모든 랭킹과 진행 중인 기록 등록 권한을 초기화합니다.</p><label for=\"admin-password\">관리자 비밀번호</label><input id=\"admin-password\" type=\"password\" required autocomplete=\"current-password\"><label class=\"confirm\"><input id=\"admin-confirm\" type=\"checkbox\" required> 전체 기록 초기화를 확인합니다.</label><p id=\"admin-message\" role=\"status\"></p><div class=\"dialog-actions\"><button type=\"button\" id=\"admin-close\">취소</button><button type=\"submit\">전체 기록 초기화</button></div></form></dialog>\n<script type=\"module\" src=\"/game.js\"></script>\n</body></html>\n",
    "style.css": ":root{color-scheme:dark;--bg:#151c18;--panel:#1e2822;--line:#354138;--text:#f1f2e8;--muted:#a5b1a6;--lime:#d9f67a;--ink:#253523}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,\"Pretendard\",\"Malgun Gothic\",system-ui,sans-serif;font-size:14px}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--lime);outline-offset:4px}button{color:inherit}a{color:inherit;text-decoration:none}[hidden]{display:none!important}.header{max-width:1400px;margin:auto;height:94px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:900;letter-spacing:1px}.brand-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--lime);color:var(--ink);font-size:30px}.brand-ko{display:block;font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:3px}.header-label{font-size:10px;letter-spacing:3px;color:var(--muted)}.icon-button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 12px}.icon-button span{font-size:10px;margin-left:3px}.icon-button[aria-pressed=true]{color:var(--lime)}main{max-width:1304px;margin:auto;padding:0 32px}.intro{display:flex;justify-content:space-between;align-items:center;padding:48px 0 32px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.8px;color:var(--muted)}.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-right:7px;vertical-align:middle}h1{font-size:clamp(34px,4vw,52px);line-height:1.22;letter-spacing:-2px;margin:15px 0}h1 span{color:var(--lime)}.intro p{color:var(--muted);line-height:1.9;font-size:13px}.intro-stamp{transform:rotate(9deg);width:126px;height:148px;background:var(--lime);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-right:28px;clip-path:polygon(0 0,100% 0,100% 92%,92% 100%,84% 92%,76% 100%,68% 92%,60% 100%,52% 92%,44% 100%,36% 92%,28% 100%,20% 92%,12% 100%,0 92%)}.intro-stamp span{font-size:10px}.intro-stamp strong{font-size:34px;line-height:1.1;margin:8px 0}.intro-stamp small{font-size:7px;letter-spacing:1px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}.game-section{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}.game-top{display:flex;justify-content:space-between;align-items:center;padding:16px;gap:8px}.mode-switch{display:flex;gap:6px}.mode-switch button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:7px;font-size:12px;font-weight:700}.mode-switch button.selected{background:var(--lime);color:var(--ink)}.mode-switch span{font-size:8px;margin-left:5px}.day{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.playfield{position:relative;aspect-ratio:1.25;background:#9ab585;overflow:hidden;isolation:isolate}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:21px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none;color:#203c2e;text-shadow:0 1px #ffffff50}.hud span{font-size:10px;font-weight:700;display:block;margin-bottom:3px}.hud strong{font-size:34px;letter-spacing:-1px;font-variant-numeric:tabular-nums}.hud strong small{font-size:16px}.hud-right{text-align:right}.zone{position:absolute;bottom:18px;left:20px;font-size:10px;font-weight:800;letter-spacing:1px;padding:8px 12px;border:1px solid #ffffff60;background:#ffffffb0;color:#284331;border-radius:5px}.pause{position:absolute;bottom:16px;right:18px;border:1px solid #fff8;border-radius:6px;background:#203c2e;color:white;width:34px;height:34px}.overlay{position:absolute;inset:0;display:flex;a