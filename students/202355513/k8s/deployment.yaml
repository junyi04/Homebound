{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "homebound",
    "labels": {
      "app": "homebound"
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "homebound"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "homebound"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "homebound",
            "image": "registry.access.redhat.com/ubi9/python-312:latest",
            "imagePullPolicy": "Always",
            "command": [
              "python",
              "/app/server.py"
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "homebound-config"
                }
              }
            ],
            "env": [
              {
                "name": "ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "homebound-secret",
                    "key": "ADMIN_PASSWORD"
                  }
                }
              },
              {
                "name": "DATA_DIR",
                "value": "/data"
              },
              {
                "name": "PYTHONDONTWRITEBYTECODE",
                "value": "1"
              },
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1"
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "app-code",
                "mountPath": "/app",
                "readOnly": true
              },
              {
                "name": "game-data",
                "mountPath": "/data"
              },
              {
                "name": "temp",
                "mountPath": "/tmp"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": "http"
              },
              "periodSeconds": 2,
              "timeoutSeconds": 2,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": "http"
              },
              "periodSeconds": 5,
              "timeoutSeconds": 2,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": "http"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 2,
              "failureThreshold": 3
            },
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "app-code",
            "configMap": {
              "name": "homebound-app"
            }
          },
          {
            "name": "game-data",
            "persistentVolumeClaim": {
              "claimName": "homebound-data"
            }
          },
          {
            "name": "temp",
            "emptyDir": {
              "sizeLimit": "16Mi"
            }
          }
        ]
      }
    }
  }
}
